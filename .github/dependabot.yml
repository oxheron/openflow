version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    groups:
      frontend-platform:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - vite
          - "@vitejs/plugin-react"
        update-types: [major, minor, patch]
      desktop-minor:
        exclude-patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - vite
          - "@vitejs/plugin-react"
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
