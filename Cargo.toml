[workspace]
resolver = "2"
members = [
  "apps/server",
  "apps/desktop/src-tauri",
  "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[patch.crates-io]
# apple-cf 0.9.3's trailing-closure call requires a newer Dispatch overlay even
# though the crate otherwise supports Swift 5.9. Keep the exact release source
# with an explicit DispatchWorkItem so Intel Macs can build with the standalone
# Swift 5.9 toolchain and the Xcode 14.3 macOS SDK.
apple-cf = { path = "vendor/apple-cf-0.9.3" }
