[package]
name = "openflow-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Local-first OpenFlow inference and model-management server"

[lib]
name = "openflow_server"
path = "src/lib.rs"

[[bin]]
name = "openflow-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64 = "0.23"
constant_time_eq = "0.5"
dirs = "5"
futures-util = "0.3"
hex = "0.4"
openflow-protocol = { path = "../../crates/protocol" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.7", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
